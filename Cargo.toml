[package]
name = "sql-editor"
version = "0.5.0"
edition = "2021"
description = "A fast, lightweight, and cross-platform SQL editor built with Rust"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rand = "0.8"

# Regex & Text
regex = "1.10"
chrono = "0.4"
urlencoding = "2.1"

# System, dialogs & clipboard
rfd = "0.15"
arboard = "3.4"
open = "5.3"
directories = "5.0"

# Networking & Updates
ureq = { version = "2.10", features = ["json", "tls"] }

# Databases
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19" }
mysql = { version = "25.0" }

# Data Export
csv = "1.3"
rust_xlsxwriter = "0.64"

[dev-dependencies]
tempfile = "3.10"
